[package]
name = "face-crop-forge"
version = "0.4.0"
edition = "2024"

[dependencies]
base64 = "=0.23.1"
console_error_panic_hook = "=0.1.7"
qrcodegen = "=1.8.0"
js-sys = "=0.3.98"
leptos = { version = "=0.8.20", features = ["csr"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = ["Blob", "BlobPropertyBag", "Clipboard", "console", "CanvasRenderingContext2d", "DataTransfer", "Document", "DragEvent", "Element", "Event", "File", "FileList", "FilePropertyBag", "FileReader", "History", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlCollection", "HtmlElement", "HtmlImageElement", "HtmlInputElement", "HtmlMediaElement", "HtmlVideoElement", "ImageBitmap", "Location", "MediaDeviceInfo", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "MouseEvent", "Navigator", "Storage", "Url", "Window", "Worker"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.71"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
